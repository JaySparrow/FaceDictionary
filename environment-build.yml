# Packaging environment: conda env create -f environment-build.yml && conda activate facedict-build
# Everything comes from pip wheels, which carry their own native libraries.
name: facedict-build
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.5.3
      - opencv-python-headless==5.0.0.93
      - PySide6-Essentials==6.11.2
      - cryptography
      - pillow
      - pillow-heif==1.7.0
      - pyinstaller==6.22.3
      - dmgbuild==1.6.7
